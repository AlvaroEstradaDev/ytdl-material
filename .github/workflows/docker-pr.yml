name: docker-pr

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push image to registry'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      image_tag:
        description: 'Docker image tag (e.g., test, pr-13)'
        required: true
        default: 'test'
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set hash
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: create-json
        id: create-json
        uses: jsdaniell/create-json@v1.2.3
        with:
          name: "version.json"
          json: '{"type": "docker", "tag": "nightly", "commit": "${{ steps.vars.outputs.sha_short }}", "date": "${{ steps.date.outputs.date }}"}'
          dir: 'backend/'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set push and tag values
        id: build_params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "push=${{ github.event.inputs.push_image }}" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event.inputs.push_image }}" = "true" ]; then
              echo "tags=ghcr.io/${{ env.OWNER }}/ytdl-material:${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
            else
              echo "tags=ytdl-material:${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ github.event.pull_request.user.login }}" = "${{ github.repository_owner }}" ]; then
            PR_TAG="pr-${{ github.event.pull_request.number }}"
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "tags=ghcr.io/${{ env.OWNER }}/ytdl-material:${PR_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "tags=ytdl-material:nightly-pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.build_params.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ env.OWNER }}
          password: ${{ secrets.CI_TOK }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: ${{ steps.build_params.outputs.push }}
          tags: ${{ steps.build_params.outputs.tags }}
